<div class="field">
  <label [for]="inputId">{{ label }}</label>
  <pa-input-text
    [inputId]="inputId"
    [type]="type"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [maxLength]="maxLength"
    [inputMode]="inputMode"
    [digitsOnly]="digitsOnly"
    [control]="control"
  />
  @if (control.touched && control.invalid) {
    <small class="error">{{ validationMessage }}</small>
  }
</div>
