$kind: http-request
url: "{{baseUrl}}/api/auth/signin"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "1002003001",
      "password": "paciente123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set("tokenPaciente", pm.response.json().accessToken);
      pm.test("Trae rol PACIENTE", function () { pm.expect(pm.response.json().roles).to.include("ROLE_PACIENTE"); });
    language: text/javascript
order: 2000
