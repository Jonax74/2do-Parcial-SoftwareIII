$kind: http-request
url: "{{baseUrl}}/api/auth/signin"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "admin123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set("tokenAdmin", pm.response.json().accessToken);
      pm.test("Trae rol ADMIN", function () { pm.expect(pm.response.json().roles).to.include("ROLE_ADMIN"); });
    language: text/javascript
order: 1000
