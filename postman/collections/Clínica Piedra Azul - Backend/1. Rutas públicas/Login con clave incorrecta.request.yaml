$kind: http-request
url: "{{baseUrl}}/api/auth/signin"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "mala"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 3000
