$kind: http-request
url: "{{baseUrl}}/api/pacientes"
method: POST
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cedula": "1004005006",
      "nombres": "Camila",
      "apellidos": "Torres",
      "email": "camila.torres@correo.com",
      "telefono": "3001234567",
      "fechaNacimiento": "2000-08-21",
      "password": "paciente123"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 9000
