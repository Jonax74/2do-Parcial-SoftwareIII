$kind: http-request
url: "{{baseUrl}}/api/citas"
method: POST
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pacienteId": 1,
      "medicoId": 1,
      "fechaHora": "2030-01-15T10:30",
      "motivo": "Control general"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 10000
