$kind: http-request
url: "{{baseUrl}}/api/citas/mis-citas"
method: GET
headers:
  Authorization: Bearer {{tokenPaciente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", function () { pm.response.to.have.status(200); });
      pm.test("Solo citas propias", function () { pm.response.json().forEach(function (c) { pm.expect(c.pacienteCedula).to.eql("1002003001"); }); });
    language: text/javascript
order: 2000
