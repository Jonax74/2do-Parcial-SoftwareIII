spring.application.name=clinica-api

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica_piedra_azul}
spring.datasource.username=${DB_USERNAME:clinica_app}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}

clinic.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
clinic.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
clinic.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
