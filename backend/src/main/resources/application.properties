spring.application.name=clinica-api

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica_piedra_azul}
spring.datasource.username=${DB_USERNAME:clinica_app}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
