services:
  db:
    image: postgres:16-alpine
    container_name: piedra-azul-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinica_piedra_azul
      POSTGRES_USER: clinica_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - piedra_azul_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica_app -d clinica_piedra_azul"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  piedra_azul_pgdata: